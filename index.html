<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Add notifications to Paws &amp; Plans</title>
<style>
  :root{ --bg:#FFF8ED; --ink:#2E2620; --soft:#8A7A69; --line:#E7D8BE; --ok:#4C8A5E; --bad:#C0503F; }
  @media (prefers-color-scheme: dark){ :root{ --bg:#231D19; --ink:#F3E9D8; --soft:#A99A8A; --line:#43392F; --ok:#6FA07E; --bad:#D9806F; } }
  body{ margin:0; min-height:100vh; display:grid; place-items:center; padding:20px; background:var(--bg); color:var(--ink); font:16px/1.5 system-ui, sans-serif; }
  main{ width:100%; max-width:440px; }
  h1{ font-size:22px; margin:0 0 6px; }
  p{ margin:0 0 16px; color:var(--soft); }
  label{ display:block; margin:16px 0 6px; font-weight:600; }
  small{ font-weight:400; color:var(--soft); }
  input{ width:100%; box-sizing:border-box; padding:11px 12px; border:1.5px solid var(--line); border-radius:12px; background:transparent; color:inherit; font:inherit; }
  button{ width:100%; margin-top:20px; padding:13px; border:0; border-radius:12px; background:var(--ink); color:var(--bg); font:inherit; font-weight:600; cursor:pointer; }
  button:disabled{ opacity:.35; cursor:not-allowed; }
  #log{ margin-top:18px; font-size:14px; }
  #log div{ margin:3px 0; }
  .ok{ color:var(--ok); } .bad{ color:var(--bad); }
  #log a{ color:inherit; font-weight:600; }
</style>
</head>
<body>
<main>
  <h1>Add notifications to Paws &amp; Plans</h1>
  <p>Choose your HTML file. This adds the notification code and hands you the updated file. Everything happens on your device.</p>

  <label for="f">Your HTML file</label>
  <input id="f" type="file" accept=".html,.htm,text/html">

  <label for="k">VAPID key <small>(optional: lets alerts arrive when the app is closed)</small></label>
  <input id="k" type="text" placeholder="Paste it here, or leave blank for now" autocomplete="off" spellcheck="false">

  <button id="go" disabled>Update my file</button>
  <div id="log" aria-live="polite"></div>
</main>

<script>
const MODULE = String.raw`  // ===== NOTIFICATIONS =====
  const VAPID_KEY = 'PASTE_YOUR_VAPID_KEY';
  let swReg = null, notifRoom = null, pushOn = false;
  const notifSeen = new Set();

  async function getSW(){
    if(swReg) return swReg;
    if(!('serviceWorker' in navigator)) return null;
    try{ swReg = await navigator.serviceWorker.register('sw.js'); await navigator.serviceWorker.ready; }
    catch(e){ swReg = null; }
    return swReg;
  }
  function updateNotifItem(){
    const b = $('notif-item');
    if(!b) return;
    const p = ('Notification' in window) ? Notification.permission : 'unsupported';
    b.textContent = p === 'granted' ? '✅ Notifications on' : p === 'denied' ? '🚫 Blocked in site settings' : '🔔 Turn on notifications';
  }
  $('more-btn').addEventListener('click', updateNotifItem);

  async function registerPushToken(){
    try{
      if(VAPID_KEY.indexOf('PASTE') !== -1 || !firebase.messaging.isSupported() || !myRole) return false;
      const reg = await getSW();
      if(!reg) return false;
      const token = await firebase.messaging().getToken({ vapidKey: VAPID_KEY, serviceWorkerRegistration: reg });
      if(!token) return false;
      const other = myRole === 'dog' ? 'cat' : 'dog';
      db.ref('rooms/'+homeId+'/pushTokens/'+other+'/'+token).remove().catch(()=>{});
      await db.ref('rooms/'+homeId+'/pushTokens/'+myRole+'/'+token).set(Date.now());
      pushOn = true;
      return true;
    }catch(e){ console.warn('push token', e); return false; }
  }
  async function enableNotifications(){
    closeMenu();
    if(!('Notification' in window)){ showToast('⚠️ This browser has no notifications'); return; }
    if(Notification.permission === 'denied'){ showToast('🚫 Blocked. Allow it in the site settings (🔒 by the address bar)', 4200); return; }
    const perm = await Notification.requestPermission();
    updateNotifItem();
    if(perm !== 'granted'){ showToast('Notifications stay off'); return; }
    await getSW();
    const ok = await registerPushToken();
    showToast(ok ? '🔔 Notifications on' : '🔔 On while this page stays open', 3000);
  }
  async function initPush(){
    updateNotifItem();
    if('Notification' in window && Notification.permission === 'granted'){ await getSW(); registerPushToken(); }
  }
  // Fallback: page is open but hidden, so show a local notification
  async function notifyNew(){
    if(!chatId) return;
    if(notifRoom !== chatId){ notifRoom = chatId; notifSeen.clear(); messages.forEach(m => notifSeen.add(m.id)); return; }
    const fresh = messages.filter(m => !notifSeen.has(m.id));
    fresh.forEach(m => notifSeen.add(m.id));
    if(pushOn || !document.hidden || !('Notification' in window) || Notification.permission !== 'granted') return;
    const m = fresh.filter(x => x.sender && x.sender !== myRole && !(x.exp && x.exp <= Date.now())).pop();
    if(!m) return;
    const name = (profiles[m.sender] && profiles[m.sender].name) || (m.sender === 'dog' ? 'Pup' : 'Kitty');
    const opts = { body: (m.img && !m.text) ? 'sent you a photo' : 'sent you a message', tag:'paws-chat', renotify:true };
    try{
      const reg = await getSW();
      if(reg) await reg.showNotification('💌 ' + name, opts);
      else { const n = new Notification('💌 ' + name, opts); n.onclick = () => { window.focus(); n.close(); }; }
    }catch(e){}
  }`;

const SDK = '<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging-compat.js"><\/script>';

// [label, what to find, how to rewrite the match]
const EDITS = [
  ['Messaging library', 'firebase-database-compat.js"><\/script>', m => m + '\n' + SDK],
  ['Menu button', /<button id="remember-item"[^>]*>[^<]*<\/button>/,
    m => m + '\n              <button id="notif-item" onclick="enableNotifications()">🔔 Turn on notifications</button>'],
  ['New-message alert', /(sweepExpired\(\);)(\s+)(renderMessages\(\);)/,
    (m, a, s, b) => a + s + 'notifyNew();' + s + b],
  ['Start-up check', /\n([ \t]*)startWalking\(\);/,
    (m, i) => m + '\n' + i + 'initPush();'],
  ['Notification code', '// ---------- build the room, then start ----------',
    m => MODULE + '\n\n  ' + m]
];

const $ = id => document.getElementById(id);
const fileEl = $('f'), keyEl = $('k'), go = $('go'), log = $('log');

function line(text, cls){
  const d = document.createElement('div');
  d.textContent = text;
  if(cls) d.className = cls;
  log.appendChild(d);
  return d;
}

fileEl.addEventListener('change', () => { go.disabled = !fileEl.files[0]; log.textContent = ''; });

go.addEventListener('click', async () => {
  const file = fileEl.files[0];
  if(!file) return;
  log.textContent = '';
  let txt = await file.text();
  const crlf = txt.indexOf('\r\n') !== -1;
  if(crlf) txt = txt.replace(/\r\n/g, '\n');

  if(txt.indexOf('enableNotifications') !== -1){
    line('This file already has the notification code, so nothing was changed.', 'bad');
    return;
  }

  let failed = false;
  for(const [name, find, fn] of EDITS){
    let n;
    if(typeof find === 'string') n = txt.split(find).length - 1;
    else n = (txt.match(new RegExp(find.source, 'g')) || []).length;
    if(n === 1){ txt = txt.replace(find, fn); line('✓ ' + name, 'ok'); }
    else { failed = true; line('✗ ' + name + ' (found ' + n + ' matches, expected 1)', 'bad'); }
  }
  if(failed){
    line('Nothing was downloaded because the file doesn’t match what I expected. Send me the result above and I’ll adjust.', 'bad');
    return;
  }

  const key = keyEl.value.replace(/[^\w-]/g, '');
  if(key){ txt = txt.replace('PASTE_YOUR_VAPID_KEY', () => key); line('✓ VAPID key added', 'ok'); }
  if(crlf) txt = txt.replace(/\n/g, '\r\n');

  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([txt], { type:'text/html' }));
  a.download = file.name;
  a.textContent = 'Download ' + file.name + ' again';
  a.click();

  line('Done. Upload the new file together with sw.js, in the same folder.', 'ok');
  if(!key) line('No VAPID key yet: alerts work while the app is open in a tab. Later, put the key into the VAPID_KEY line near the end of the file.');
  const box = document.createElement('div'); box.appendChild(a); log.appendChild(box);
});
</script>
</body>
</html>
